<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Speed Runner</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Import Map for Modules -->
    <script type="importmap">
    {
        "imports": {
            "leaflet": "https://esm.sh/leaflet@1.9.4"
        }
    }
    </script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://esm.sh/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div id="game-container">
        <div id="map"></div>
        
        <div id="hud">
            <div class="stat-box">
                <div class="label">YOUR SPEED</div>
                <div class="value" id="speed-val">0.0</div>
                <div class="unit">km/h</div>
            </div>
            <div class="stat-box" id="rival-box" style="opacity: 0.5;">
                <div class="label">RIVAL PACE</div>
                <div class="value" id="rival-val">--</div>
                <div class="unit">km/h</div>
            </div>
        </div>

        <div id="status-bar">Initialize GPS...</div>

        <div id="controls">
            <button id="start-btn">START RUN</button>
            <button id="sim-btn" class="secondary">SIMULATE (WASD)</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
